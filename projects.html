<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101411" />
    <meta
      name="description"
      content="Abhinav V — computer science student and developer. Explore my web and mobile projects, technical skills, and development journey."
    />
    <meta property="og:title" content="Abhinav — Developer & Curious Builder" />
    <meta
      property="og:description"
      content="Building ideas. Crafting experiences. Explore my projects, skills, and journey."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Abhinav — Full Stack Developer</title>
    <script>
      try {
        const theme = localStorage.getItem('abhinav-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#101411' : '#f7f8f2'
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to explore this React portfolio.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
